<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Tenebris • Tattoo</title>
    <style>
        :root {
            --noir: #0c0c0c;
            --rouge: #8c1c28;
            --gris: #222222;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--noir);
            color: #bbb;
            font-family: 'Arial', sans-serif;
        }
        
        header {
            height: 100vh;
            background: linear-gradient(rgba(10,10,10,0.85), rgba(10,10,10,0.95)), url('https://picsum.photos/id/1015/2000/1200');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-bottom: 3px solid var(--rouge);
        }
        
        h1 {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 12px;
            color: white;
            text-transform: uppercase;
        }
        
        .tagline {
            color: var(--rouge);
            font-size: 1.5rem;
            letter-spacing: 6px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>IN TENEBRIS</h1>
            <p class="tagline">TATTOO STUDIO</p>
        </div>
    </header>
</body>
</html>
