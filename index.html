<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Tenebris • Tattoo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap');
        
        body { 
            margin: 0; 
            background: #050505; 
            color: #ccc; 
            font-family: system-ui, sans-serif; 
        }
        
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(5,5,5,0.95);
            padding: 20px 0;
            text-align: center;
            z-index: 100;
            border-bottom: 2px solid #9b1c2c;
        }
        
        nav a {
            color: #ccc;
            text-decoration: none;
            margin: 0 25px;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        
        nav a:hover { color: #d4af37; }
        
        header {
            height: 100vh;
            background: linear-gradient(rgba(5,5,5,0.8), rgba(5,5,5,0.9)), url('https://raw.githubusercontent.com/Trolorder/intenebris.github.io/refs/heads/main/2021-12-06.png');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        h1 {
            font-family: 'UnifrakturCook', cursive;
            font-size: 5.5rem;
            color: #d4af37;
            text-shadow: 6px 6px 0 #000;
        }
        
        .tagline { 
            font-size: 1.3rem; 
            color: #aaa; 
            letter-spacing: 5px; 
        }
        
        section { 
            padding: 120px 8% 80px; 
            text-align: center; 
        }
        
        h2 { 
            color: #9b1c2c; 
            font-size: 3rem; 
            margin-bottom: 60px; 
            letter-spacing: 3px; 
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 15px;
        }
        
        .gallery img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border: 3px solid #222;
            transition: all 0.4s;
        }
        
        .gallery img:hover {
            transform: scale(1.03);
            border-color: #9b1c2c;
            filter: brightness(1.1);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            max-width: 900px;
            margin: 0 auto;
            text-align: left;
        }
        
        .info p {
            margin-bottom: 35px;
            font-size: 1.2rem;
        }
        
        .info a {
            color: #d4af37;
            text-decoration: none;
        }
        
        .form input, .form textarea {
            width: 100%;
            background: #111;
            border: 2px solid #222;
            color: #ddd;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 1rem;
        }
        
        .form button {
            background: #9b1c2c;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#accueil">Accueil</a>
        <a href="#galerie">Galerie</a>
        <a href="#contact">Contact</a>
    </nav>

    <header id="accueil">
        <div>
            <h1>IN TENEBRIS</h1>
            <p class="tagline">SALON DE TATOUAGE</p>
        </div>
    </header>

    <section id="galerie">
        <h2>GALERIE</h2>
        <div class="gallery">
            <img src="Photos/2026-02-22dfgdfg.jpg" alt="Tatouage">
            <img src="Photos/2026-02-22dfgdfgd.jpg" alt="Tatouage">
            <img src="Photos/2026-02-22xwcxwc.jpg" alt="Tatouage">
            <img src="Photos/2026-03-17.jpg" alt="Tatouage">
            <img src="Photos/dssd.jpg" alt="Tatouage">
            <img src="Photos/qsdqsdsq.jpg" alt="Tatouage">
            <img src="Photos/unnamed.jpg" alt="Tatouage">
            <img src="Photos/unnameddsfdff.jpg" alt="Tatouage">
            <img src="Photos/unnamedgfhfghfghf.jpg" alt="Tatouage">
            <img src="Photos/zeazeaze.jpg" alt="Tatouage">
        </div>
    </section>

    <section id="contact">
        <h2>CONTACTEZ-NOUS</h2>
        <div class="contact-grid">
            <div class="info">
                <p><strong>20 Rue du Général Leclerc</strong><br>
                76000 Rouen</p>
                
                <p><strong>Téléphone :</strong><br>
                <a href="tel:0612345678">06.24.97.01.55</a></p>
                
                <p><strong>Instagram :</strong><br>
                <a href="https://instagram.com/intenebris.tattoo" target="_blank">@intenebris.rouen</a></p>
            </div>
            
            <div class="form">
                <input type="text" placeholder="Votre nom">
                <input type="email" placeholder="Votre email">
                <textarea placeholder="Votre message..." rows="6"></textarea>
                <button>ENVOYER LE MESSAGE</button>
            </div>
        </div>
    </section>
</body>
</html>
