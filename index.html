<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Tenebris • Tattoo</title>
    <style>
        :root {
            --noir: #0a0a0a;
            --rouge: #9b1c2c;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: var(--noir);
            color: #ddd;
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
        }
        
        header {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://picsum.photos/id/1015/2000/1200');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        h1 {
            font-size: 4.5rem;
            color: white;
            font-weight: 900;
            letter-spacing: 8px;
        }
        
        .tagline {
            color: var(--rouge);
            font-size: 1.4rem;
            margin-top: 1rem;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>IN TENEBRIS</h1>
            <p class="tagline">TATTOO STUDIO</p>
        </div>
    </header>
</body>
</html>
