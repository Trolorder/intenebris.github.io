<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Tenebris</title>
    <style>
        body {
            background: #0a0a0a;
            color: #ddd;
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        header {
            height: 100vh;
            background: url('https://picsum.photos/id/1015/2000/1200') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10,10,10,0.85);
        }
        
        .content {
            text-align: center;
            position: relative;
            z-index: 2;
        }
        
        h1 {
            font-size: 6.5rem;
            font-weight: 900;
            letter-spacing: 15px;
            color: #fff;
            text-transform: uppercase;
        }
        
        .tagline {
            color: #9b1c2c;
            font-size: 1.8rem;
            letter-spacing: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="content">
            <h1>IN TENEBRIS</h1>
            <p class="tagline">TATTOO STUDIO</p>
        </div>
    </header>
</body>
</html>
